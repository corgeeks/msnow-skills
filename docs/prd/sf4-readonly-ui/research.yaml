- text: 'shadcn/ui current setup for a Vite + React 19 + TypeScript app with Tailwind CSS v4 (not Next.js): exact init steps (`npx shadcn@latest init`, components.json fields, path aliases in tsconfig/vite.config,
    @tailwindcss/vite plugin), which runtime packages it adds (radix-ui, class-variance-authority, clsx, tailwind-merge, lucide-react, tw-animate-css), and whether it works when the app lives in a subdirectory
    (factory/ui) of a non-UI package.'
  mode: answer
  answer: |-
    VERIFIED FROM DOCS (2026-11 snapshot of ui.shadcn.com).

    STEPS (existing Vite + React + TS app, Tailwind v4):
    1. Tailwind v4 (skip if present): `pnpm add tailwindcss @tailwindcss/vite`. Replace src/index.css contents with `@import "tailwindcss";`.
    2. tsconfig: in tsconfig.json AND tsconfig.app.json (Vite splits configs) add under compilerOptions: `"baseUrl": ".", "paths": { "@/*": ["./src/*"] }`.
    3. `pnpm add -D @types/node`.
    4. vite.config.ts:
    ```ts
    import path from "path"
    import tailwindcss from "@tailwindcss/vite"
    import react from "@vitejs/plugin-react"
    import { defineConfig } from "vite"
    export default defineConfig({
      plugins: [react(), tailwindcss()],
      resolve: { alias: { "@": path.resolve(__dirname, "./src") } },
    })
    ```
    5. `pnpm dlx shadcn@latest init` (interactive; writes components.json, cn util, CSS variables, deps).
    6. `pnpm dlx shadcn@latest add button`; import from `@/components/ui/button`.
    Scaffold-new alternative: `pnpm dlx shadcn@latest init -t vite` (or `--preset <code> --template vite` from shadcn/create).

    components.json (Tailwind v4 shape; `tailwind.config` must be empty string for v4):
    ```json
    {
      "$schema": "https://ui.shadcn.com/schema.json",
      "style": "base-nova",
      "rsc": false,
      "tsx": true,
      "tailwind": { "config": "", "css": "src/index.css", "baseColor": "neutral", "cssVariables": true },
      "iconLibrary": "lucide",
      "aliases": { "components": "@/components", "ui": "@/components/ui", "lib": "@/lib", "hooks": "@/hooks", "utils": "@/lib/utils" }
    }
    ```
    Required by schema: style, tailwind{config,css,baseColor,cssVariables}, rsc, aliases{utils,components}. `style`, `baseColor`, `cssVariables` are fixed after init. `rsc: false` for Vite (no RSC). Style enum includes base-* (Base UI primitives) and radix-* (Radix primitives); `new-york` / `default` are deprecated.

    RUNTIME PACKAGES (from registry index items, not from the docs prose):
    - style `radix-nova` (radix-* styles): deps `radix-ui`, `class-variance-authority`, `lucide-react`, `cn`; devDeps `tw-animate-css`, `shadcn`.
    - style `base-nova` (base-* styles, current default in schema order): deps `@base-ui/react`, `class-variance-authority`, `lucide-react`, `cn`; devDeps `tw-animate-css`, `shadcn`.
    - Your list (radix-ui, cva, clsx, tailwind-merge, lucide-react, tw-animate-css) is outdated: since the Sept 2026 changelog, components import `cn` from the `cn` package (drop-in for `twMerge(clsx(...))`), and `init` generates a one-line `lib/utils.ts` re-exporting it. `clsx`/`tailwind-merge` are not installed directly for new projects; `pnpm dlx shadcn@latest migrate cn` removes them for old projects. Whether the `cn` package itself depends on clsx/tailwind-merge: [UNVERIFIED].
    - The shadcn styles CSS imports `@import "tw-animate-css";` and `@import "shadcn/tailwind.css";` (so the `shadcn` devDependency is needed for the CSS import).
    - Also installed by you: tailwindcss, @tailwindcss/vite (dev/runtime as per your setup), @types/node.

    SUBDIRECTORY (factory/ui inside a non-UI Node package): supported. The CLI resolves components.json from `--cwd`, defaulting to the current directory. Run from factory/ui, or from anywhere with `-c`:
    `pnpm dlx shadcn@latest init -c factory/ui` and `pnpm dlx shadcn@latest add button -c factory/ui`.
    Everything is relative to that dir: `tailwind.css` path, alias targets, tsconfig/vite.config. The parent factory/ package.json is irrelevant unless you use package-level `imports`. Monorepo docs confirm the model: run `add` in the app's own path, each workspace has its own components.json. Using `paths` aliases (not package.json#imports) is the simplest choice for an app in a subdir. Caveat: the `@/*` alias must map inside factory/ui/src, not factory/src.

    LAZY NOTES: skipped: monorepo/`@workspace/ui` split (single app), `rsc`, `package.json#imports` aliases. Add when: a second app shares components.

    `__dirname` in vite.config.ts under `"type": "module"`: docs use it as-is; Vite shims it when bundling config [UNVERIFIED in this session].
