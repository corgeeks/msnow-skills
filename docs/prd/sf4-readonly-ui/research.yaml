- text: 'TanStack Router (latest) with Vite and React: code-based vs file-based routing setup (@tanstack/router-plugin/vite, routeTree.gen.ts), minimal code-based route tree for 4 routes with path params
    and search params, type-safe Link/useParams, and whether it works with a static build served under SPA history fallback. Also: what is the browser ''Navigation API'' (navigation.navigate / navigate
    event) vs the Location API, its baseline status in 2026, and does TanStack Router use it?'
  mode: answer
  answer: |-
    ## 1. Code-based vs file-based (TanStack Router, Vite, React)

    - File-based (recommended by docs): `tanstackRouter()` from `@tanstack/router-plugin/vite` scans `src/routes`, generates `src/routeTree.gen.ts`, and must be listed BEFORE `react()`. Config defaults: `routesDirectory: './src/routes'`, `generatedRouteTree: './src/routeTree.gen.ts'`. `autoCodeSplitting: true` is available only with file-based routing (Vite, Rspack/Rsbuild, Webpack; not esbuild). Commit `routeTree.gen.ts`, never hand-edit it.
    - Code-based (what this PRD needs if you don't want generated files): the docs say it is "not recommended for most applications". You build the tree with `createRootRoute`, `createRoute({ getParentRoute, path })`, and `rootRoute.addChildren([...])`. No `routeTree.gen.ts` is generated. `autoCodeSplitting` does NOT apply. Splitting is manual: `createLazyRoute('/x')` in a separate file plus `route.lazy(() => import('./x.lazy').then(d => d.Route))`, or `lazyFn(() => import(...), 'loader')` for loaders. Do not use `lazyRouteComponent` together with autoCodeSplitting.

    Minimal code-based tree (4 routes, path params, validated search). No Vite plugin is needed for this.

    ```tsx
    // src/router.tsx
    import { createRootRoute, createRoute, createRouter, Link, Outlet, getRouteApi } from '@tanstack/react-router'
    import { z } from 'zod' // zod v4: schema is usable directly as validateSearch

    const rootRoute = createRootRoute({ component: () => <Outlet /> })

    const indexRoute = createRoute({
      getParentRoute: () => rootRoute,
      path: '/',
      component: () => <Link to="/gates">Gates</Link>,
    })

    const itemRoute = createRoute({
      getParentRoute: () => rootRoute,
      path: 'items/$id',
      validateSearch: z.object({ tab: z.enum(['details', 'history']).catch('details') }),
      component: ItemPage,
    })

    const runRoute = createRoute({
      getParentRoute: () => rootRoute,
      path: 'runs/$id',
      validateSearch: z.object({ step: z.coerce.number().int().min(0).catch(0) }),
      component: RunPage,
    })

    const gatesRoute = createRoute({
      getParentRoute: () => rootRoute,
      path: 'gates',
      validateSearch: z.object({ status: z.enum(['all', 'open', 'closed']).catch('all') }),
      component: GatesPage,
    })

    const routeTree = rootRoute.addChildren([indexRoute, itemRoute, runRoute, gatesRoute])

    export const router = createRouter({ routeTree }) // history defaults to createBrowserHistory

    declare module '@tanstack/react-router' {
      interface Register {
        router: typeof router
      }
    }

    function ItemPage() {
      const { id } = itemRoute.useParams()   // typed: { id: string }
      const { tab } = itemRoute.useSearch()  // typed: 'details' | 'history'
      return (
        <>
          <Link to="/items/$id" params={{ id }} search={{ tab: 'history' }}>History</Link>
          <Link to="/runs/$id" params={{ id: 'r1' }} search={{ step: 2 }}>Run</Link>
        </>
      )
    }

    // In a separate, code-split component file, use getRouteApi instead of importing the route:
    // const api = getRouteApi('/runs/$id'); const { id } = api.useParams()

    function RunPage() { /* ... */ return null }
    function GatesPage() { /* ... */ return null }
    ```

    ```tsx
    // src/main.tsx
    import { RouterProvider } from '@tanstack/react-router'
    import { createRoot } from 'react-dom/client'
    import { router } from './router'

    createRoot(document.getElementById('root')!).render(<RouterProvider router={router} />)
    ```

    Notes:
    - `Link` `to` is checked against the `Register`ed router. `params` and `search` are checked per route. Route search validation runs when the route matches; a validator that throws triggers `errorComponent` (`VALIDATE_SEARCH`). `.catch()` gives fallbacks instead.
    - Inline arrow components above are shortcuts. In a real app keep them in their own files and use `getRouteApi`.

    ## 2. Static build under SPA history fallback

    - `vite build` emits `dist/index.html` plus `dist/assets/*` with absolute `/assets/...` URLs by default. `createBrowserHistory` (the default) serves `/items/42` from the same `index.html`, so it works if the server rewrites unknown paths to `index.html`.
    - Dev and `vite preview`: `appType` defaults to `'spa'`, which uses SPA fallback (preview uses sirv `single: true`).
    - Production static host, nginx example: `try_files $uri /index.html;`.
    - Node daemon: serve `dist` with static middleware, then a catch-all `GET *` that returns `dist/index.html`. Register the API routes BEFORE that catch-all, or they get swallowed.
    - Subpath deployment: set `base` in `vite.config.ts` and `createRouter({ routeTree, basepath })`. [UNVERIFIED: `basepath` option name, not checked here.]
    - I did NOT run a build; this is from docs plus Vite's documented `'spa'` default. Verify with `vite build && vite preview`, then open `/items/1?tab=history` directly.

    ## 3. Navigation API vs Location API

    - Location API: `window.location` (`href`, `assign`, `replace`) plus the History API (`history.pushState`/`replaceState`, `popstate`). `popstate` does not fire on programmatic `pushState`/`replaceState`, and you must intercept link clicks yourself.
    - Navigation API: `window.navigation` returns a `Navigation` object. Its `navigate` event fires with a `NavigateEvent` for all navigations (links, form submits, back/forward, `navigation.navigate()`). `event.intercept({ handler })` lets you update the UI, `event.scroll()` and `scroll: 'manual'` control scroll timing, and `event.canIntercept` / `event.destination.url` are available. `navigation.navigate()`, `back()`, `forward()`, `traverseTo()`, and `currentEntry` are also available.
    - Baseline: MDN marks Navigation API as "Baseline 2026 Newly available" since January 2026. web.dev (Feb 17, 2026) says it became Newly available across all major browsers in early 2026, with Safari and Firefox support landing. "Newly available" is not "Widely available" yet. Chrome-first support dates back to 2022.
    - TanStack Router / @tanstack/history: does NOT use `window.navigation` in the core path. The history docs say the default browser history "uses the browser's history API". A grep of `packages/history/src/index.ts` on `main` found no `window.navigation` or `NavigateEvent` usage, only comments. I did not inspect the browser-history implementation file in full, so that part is [UNVERIFIED] beyond this grep.

    ## Caveats
    - Nothing was executed. All API claims come from the official docs and MDN/web.dev pages listed below.
    - Code-based routing is the option the TanStack docs discourage; file-based with `routeTree.gen.ts` is the default they recommend.
