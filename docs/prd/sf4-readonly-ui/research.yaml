- text: 'shadcn MCP server (https://ui.shadcn.com/docs/mcp): what it provides, how to install/register it (`npx shadcn@latest mcp init --client <client>`), which clients are supported, and how to register
    a stdio MCP server manually for a generic MCP client such as oh-my-pi (omp) — omp''s MCP config file location/format.'
  mode: answer
  answer: |-
    **shadcn MCP server**

    Tools (7, registered in `packages/shadcn/src/mcp/index.ts`, server name `shadcn`):
    - `get_project_registries`: lists registries from components.json
    - `list_items_in_registries`: lists items, filterable by registry, type, limit and offset
    - `search_items_in_registries`: fuzzy search over item names and descriptions
    - `view_items_in_registries`: details and file contents for specific items
    - `get_item_examples_from_registries`: usage examples
    - `get_add_command_for_items`: returns the install command for items
    - `get_audit_checklist`: audit checklist

    The server reads registries from `components.json` (`process.cwd()`), so launch it from the project root. Registries are declared like this:
    ```json
    { "registries": { "@acme": "https://acme.com/r/{name}.json" } }
    ```
    The default `@shadcn` registry needs no config. Private registries can use `headers` with `${ENV}` interpolation.

    **Install/register**
    - Command: `npx shadcn@latest mcp init --client <client>` (docs use `pnpm dlx shadcn@latest mcp init --client claude`). It deep-merges into the client's config file and adds `shadcn@latest` as a dev dependency when a components.json exists.
    - `--client` values: `claude`, `cursor`, `vscode`, `codex`, `opencode`. Without `--client` it prompts. Config paths written:
      - claude → `.mcp.json` (`mcpServers.shadcn`)
      - cursor → `.cursor/mcp.json` (`mcpServers.shadcn`)
      - vscode → `.vscode/mcp.json` (`servers.shadcn`)
      - opencode → `opencode.json` (`mcp.shadcn` with `type: local`, `command: ["npx","shadcn@latest","mcp"]`)
      - codex → writes nothing. It only prints the TOML snippet for `~/.codex/config.toml`.
    - Server entrypoint: `npx shadcn@latest mcp` (stdio). Stdout is the protocol, so errors go to stderr.

    **Generic stdio MCP client (manual)**
    ```json
    {
      "mcpServers": {
        "shadcn": { "command": "npx", "args": ["shadcn@latest", "mcp"] }
      }
    }
    ```
    TOML equivalent (Codex):
    ```toml
    [mcp_servers.shadcn]
    command = "npx"
    args = ["shadcn@latest", "mcp"]
    ```
    Run it with the working directory set to the project root.

    **oh-my-pi MCP config**
    - Format: JSON, top-level `mcpServers` map. Optional `$schema`, `disabledServers`, `enabledServers`.
    - Primary project file: `.omp/mcp.json`. Also reads `.omp/.mcp.json`.
    - Primary user file: `~/.omp/agent/mcp.json`. Also reads `~/.omp/agent/.mcp.json`. With a named profile: `~/.omp/profiles/<name>/agent/mcp.json`. `PI_CONFIG_DIR` and `PI_CODING_AGENT_DIR` can relocate these.
    - Yes, it reads Claude-format `.mcp.json`. Root-level `mcp.json` and `.mcp.json` in the project are loaded as a low-priority fallback (priority 5, source level "project"). A setting `mcp.enableProjectConfig` ("Load .mcp.json/mcp.json from project root") exists; its default and whether it gates this fallback are [UNVERIFIED].
    - It also imports `.claude/.mcp.json`, `.claude/mcp.json`, `~/.claude.json`, `~/.claude/mcp.json`, `.cursor/mcp.json`, `.vscode/mcp.json` (`servers` key), Codex, Gemini, OpenCode and Windsurf configs.
    - Server entry shape: `type` is `stdio` (default when `command` is present), `http` or `sse`. Fields: `command`, `args`, `env`, `cwd`, `url`, `headers`, `enabled`, `timeout`.
    - Example for `.omp/mcp.json`:
    ```json
    {
      "$schema": "https://raw.githubusercontent.com/can1357/oh-my-pi/main/packages/coding-agent/src/config/mcp-schema.json",
      "mcpServers": {
        "shadcn": { "type": "stdio", "command": "npx", "args": ["shadcn@latest", "mcp"] }
      }
    }
    ```
    - Local state: `~/.omp/agent/` has `config.yml` but no `mcp.json` or `.mcp.json`. `/home/matt/Projects/corgeek.net/msnow-skills` showed no MCP config in a top-level glob (not exhaustively checked). I did not modify anything.

    **Practical choice:** the root `.mcp.json` from `mcp init --client claude` is read by omp as a fallback, so one file serves both Claude Code and omp. For an omp-owned config, use `.omp/mcp.json` with the snippet above. Skipped: an omp-specific `mcp init` (none exists in the shadcn CLI). Add it when the shadcn CLI supports an omp client.
  citations:
