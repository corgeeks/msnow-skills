- text: 'Minimal stack for a read-only React UI served as static files by a Node `node:http` daemon with live updates: Vite build output layout, client routing fallback, and Server-Sent Events (SSE) from
    `node:http` (headers, keep-alive, reconnection with Last-Event-ID).'
  mode: answer
  answer: |-
    VERSIONS / BUILD
    - Current Vite major is 8 (latest stable reported as 8.3.8, 2026-11-11; 8.4.0-beta.1 is a prerelease) [dev-news / GitWatchman; vite.dev does not state the version on its pages]. Vite 8 bundles with Rolldown (build.rolldownOptions). Pin the major, e.g. "vite": "^8", plus @vitejs/plugin-react.
    - Defaults (Vite 8 docs): build.outDir = "dist" (relative to root), build.assetsDir = "assets", base = "/". Build with `vite build`; `vite preview` is NOT a production server.
    - Output layout: dist/index.html plus hashed dist/assets/*.js and *.css. Asset URLs in index.html and CSS are rewritten to the base path.
    - Keep base "/" when node serves dist at the origin root. Use base "./" only if you serve under an unknown prefix. For a subpath, set base "/prefix/" and serve under that prefix.
    - Set `Cache-Control: no-cache` on index.html; hashed assets can be cached long-term (Vite docs say this for stale-chunk avoidance).
    - Vite's SPA history fallback exists only in the dev server. In production node must do it itself (below).
    - Target default is 'baseline-widely-available' per cli.ts [UNVERIFIED for exact default string in v8.3.8].

    STATIC + SPA FALLBACK (node:http, no express)
    - Resolve each request path under dist/ and reject traversal (startsWith(DIST + sep)).
    - If the file is missing: if the path has an extension (e.g. /assets/old-chunk.js), return 404 and never serve index.html (serving HTML for a missing module breaks old-deploy clients). Otherwise (client routes like /runs/42) return dist/index.html.
    - Set Content-Type per extension; module scripts need a JS MIME type.

    SSE (text/event-stream) WITH node:http
    - Headers: 200, `Content-Type: text/event-stream` (EventSource fails the connection on any other type or status other than 200; 204 means stop reconnecting), `Cache-Control: no-cache`, `Connection: keep-alive`, `X-Accel-Buffering: no` for nginx-style proxies. Avoid gzip middleware on this route.
    - Flushing: `res.writeHead(...)` then `res.flushHeaders()` (Node: response.flushHeaders() flushes headers; response.write() sends body chunks immediately, no buffering on the Node side). Node sends chunked encoding automatically since no Content-Length is set.
    - Heartbeat: write a comment line `: ping\n\n` every ~15 s. EventSource ignores comment lines (lines starting with ':'), but it keeps proxies and half-open sockets honest. Clear the interval on res 'close' (use res.on('close'), not req, for SSE).
    - Frame format: optional `id:`, `event:`, `data:` lines, terminated by a blank line. Multi-line data needs one `data:` per line.
    - Send `retry: 3000\n\n` once on connect to set the reconnection delay in ms.

    RECONNECTION (WHATWG spec)
    - Browser reconnects automatically on network error or when the body ends, after the reconnection time (default implementation-defined, a few seconds; set with `retry:`). Each attempt fires `error` on the EventSource; readyState is CONNECTING while retrying and CLOSED only on fatal failure or close().
    - Last-Event-ID: the browser keeps a "last event ID string" that is set from each `id:` field (buffer not reset between events; `id:` values containing NUL are ignored). On reconnect it sends the request header `Last-Event-ID: <value>`. Server: `const last = req.headers['last-event-id']` then replay rows with id > last from your store before attaching the client.
    - Caveats: Last-Event-ID is sent only on automatic reconnects, not on a fresh page load. For a fresh load, fetch a snapshot via REST, then open EventSource. Use a monotonically increasing id (e.g. a DB sequence/rowid), not a timestamp. EventSource cannot set custom headers.
    - A non-200 or non-text/event-stream response is a fatal failure: EventSource stops and does not retry. Restart logic for a daemon restart must therefore use 200 responses, or the UI must recreate the EventSource itself on error when readyState === CLOSED.

    SNIPPET (node:http SSE + static + SPA fallback) [UNVERIFIED: not executed; no shell tool available in this investigation]
    ```js
    import { createServer } from 'node:http';
    import { createReadStream } from 'node:fs';
    import { stat } from 'node:fs/promises';
    import { extname, resolve, sep } from 'node:path';

    const DIST = resolve('dist');
    const MIME = { '.html': 'text/html; charset=utf-8', '.js': 'text/javascript; charset=utf-8', '.css': 'text/css; charset=utf-8', '.svg': 'image/svg+xml', '.json': 'application/json', '.png': 'image/png', '.ico': 'image/x-icon', '.woff2': 'font/woff2' };
    const clients = new Set();

    export function publish(id, event, data) { // call after committing to the store
      const frame = `id: ${id}\nevent: ${event}\ndata: ${JSON.stringify(data)}\n\n`;
      for (const res of clients) res.write(frame);
    }

    createServer(async (req, res) => {
      const { pathname } = new URL(req.url, 'http://localhost');

      if (pathname === '/events') {
        res.writeHead(200, { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', Connection: 'keep-alive', 'X-Accel-Buffering': 'no' });
        res.flushHeaders();
        res.write('retry: 3000\n\n');
        clients.add(res);
        // req.headers['last-event-id'] -> replay rows with id > that value here
        const heartbeat = setInterval(() => res.write(': ping\n\n'), 15_000);
        res.on('close', () => { clearInterval(heartbeat); clients.delete(res); });
        return;
      }

      let file = resolve(DIST, `.${pathname}`);
      if (!file.startsWith(DIST + sep)) return void res.writeHead(403).end();
      if (!(await stat(file).catch(() => null))?.isFile()) {
        if (extname(pathname)) return void res.writeHead(404).end(); // missing asset: never serve HTML
        file = resolve(DIST, 'index.html');                          // SPA fallback
      }
      res.writeHead(200, { 'Content-Type': MIME[extname(file)] ?? 'application/octet-stream' });
      createReadStream(file).pipe(res);
    }).listen(8080);
    ```

    SKIPPED: express, compression, a Vite dev-server proxy, and replay storage (you own the event table). Add when: you need auth, gzip for large payloads, or dev-time HMR proxying.

    TODO (not verified): Node http.Server default timeouts for long-lived SSE sockets; confirm with the v24 server docs before relying on the heartbeat interval alone.
