- text: 'omp (oh-my-pi) `--mode rpc` protocol: exact JSON frames for `prompt`, the `ready` handshake, `agent_end` completion, `get_state`, `get_session_stats` (token/cost fields), `abort`, and how tool-approval
    requests behave under `--approval-mode yolo` with `--max-time`/`--max-cost` caps (what event/exit signals a cap hit)?'
  mode: deep-research
  answer: |-
    NOT LIVE-VERIFIED: this agent has no shell/exec tool, so I could not spawn `omp --mode rpc --no-session` or capture frames. Everything below comes from docs (rpc.md, cli-reference.md, approval-mode.md on main, and omp.sh/docs/rpc). Local binary /home/matt/.local/bin/omp is an ELF with no readable help text. Items marked [UNVERIFIED] are not documented.

    FRAMING: stdin/stdout are newline-delimited JSON (custom JSONL, not JSON-RPC 2.0). One object per line, '\n' terminated. stderr must be kept separate. Launch: `omp --mode rpc --no-session --cwd <dir> --model anthropic/claude-haiku-5-5` (--model accepts `provider/id` exactly). `--mode rpc-ui` is the UI-capable variant; `--no-ui` makes extensions headless.

    READY HANDSHAKE (first stdout line, before any command is processed):
    {"type":"ready","protocolVersion":1,"supportedProtocolVersions":[1,2],"maxFrameBytes":1048576,"maxReassembledFrameBytes":67108864,"supportsBashExcludeFromContext":true}
    Wait for it before sending commands. Optional v2 negotiation: send {"id":"protocol-1","type":"negotiate_protocol","protocolVersion":2}; success response is v1, then oversized frames arrive as rpc_chunk {chunkId,index,count,byteLength,data(base64)}. Extension startup runs after ready; commands wait behind it.

    PROMPT: stdin {"id":"p1","type":"prompt","message":"Reply with only the word ok"} (optional images[], streamingBehavior:"steer"|"followUp" if agent busy). Immediate ack: {"id":"p1","type":"response","command":"prompt","success":true,"data":{"agentInvoked":true}} (acks ADMISSION, not completion). Only if builtin/local slash command: data.agentInvoked:false and no further completion frame. Otherwise completion comes from:
    {"type":"prompt_result","id":"p1","agentInvoked":true,"status":"completed","sessionSettled":true}
    status: completed | aborted | error. error (status error only): {message,provider?,model?,httpStatus?,retryable,code?}. A failed provider turn still gives success:true; read status, not text.

    AGENT_END / completion: stream includes agent_start, turn_start, message_start/update/end, tool_execution_*, ..., agent_end {messages, isTerminal?, yielded?, awaitingAsyncWork?, messageCount? (compaction)}. A run is over when frame.type==='agent_end' && isTerminal!==false (absent = terminal). Use yielded for prompt yield. Prefer prompt_result for per-prompt outcome. session_settled ({type:'session_settled'}) = nothing can wake the session again (no background bash/task/eval pending); tear-down/sandbox-recycle must wait for this or get_state.isSettled. Keep stdout drained; agent_end.messages can be compacted, so collect message_end frames as transcript.

    GET_STATE: {"id":"s1","type":"get_state"} -> data includes model{provider,id}, thinkingLevel, isStreaming, isCompacting, sessionFile?, sessionId, sessionName?, messageCount, queuedMessageCount, hasPendingAsyncWork, isSettled, queuedMessages{steering,followUp}, fastModeEnabled, fastModeActive, autoCompactionEnabled, contextUsage?{tokens,contextWindow,percent}, goal, todoPhases, tokensPerSecond|null.

    GET_SESSION_STATS: {"id":"c1","type":"get_session_stats"} -> data: SessionStats = {sessionFile?, sessionId, userMessages, assistantMessages, toolCalls, toolResults, totalMessages, tokens:{input,output,reasoning,cacheRead,cacheWrite,total}, premiumRequests, cost, contextUsage?}. The docs do NOT specify the type/unit of `cost` (presumably cumulative USD number) [UNVERIFIED]. Per-message cost is at assistant message usage.cost{input,output,cacheRead,cacheWrite,total}. Cache-warm costs are already included in SessionStats.

    ABORT: {"id":"a1","type":"abort"} -> response success:true with no data. The run then ends with the terminal agent_end (stopReason:"aborted" on assistant message) and prompt_result status:"aborted". Wait for both. Also: abort_and_prompt, abort_retry, abort_bash, abort_and_restore_queue.

    APPROVAL / YOLO: approval tiers are read|write|exec. `--approval-mode yolo` (or `--yolo` / `--auto-approve`, which force yolo over an explicit --approval-mode) auto-approves ALL tiers, so no approval prompt is emitted. Only explicit tool/user policies still prompt or deny: tools.approval.<tool>: prompt|deny and object-form tool policy:deny; a bash critical-pattern override is IGNORED in yolo. In RPC with no --no-ui, a call that still requires prompting goes to a select (extension_ui_request method:'select' with options; reply extension_ui_response {id,value}); under --no-ui such a call FAILS CLOSED with a no-interactive-UI error instead of sending a dialog. Subagents run yolo; any call resolving to prompt is rejected there. Non-yolo/always-ask does not apply in this configuration.

    CAPS:
    - --max-cost <usd>: stops SENDING model requests once session spend reaches the cap; an in-flight request can overshoot. RPC signal: prompt_result {status:"error", error:{code:"cost_cap", message, retryable:false?}} for that prompt. The server keeps running; later prompts also end with cost_cap until the cap is raised. There is no process exit for RPC (the exit-status 3 rule is documented only for print mode, `-p`, where the cap message goes to stderr). [exit status under RPC: UNVERIFIED]
    - --max-time <duration> (e.g. 600, 10m, 1h): documented in cli-reference as 'Stop the session after this duration', with no RPC-specific behavior or event named. RPC event/exit signal for hitting it: [UNVERIFIED]; the docs do not name one. Assume it may appear as a session end/prompt_result aborted or a process exit, and detect via stdout EOF plus exit code. Verify empirically with a tiny --max-time before relying on it.
    - Other exit codes: stdin EOF -> drains accepted commands, disposes, exit 0; session-persistence failure latched at disposal -> exit 1; output/spool failure -> exit 1.

    OTHER USEFUL FRAMES: extension_error {extensionPath,event,error}; notice {level,message,source?}; queue_update; rpc_frame_error; auto_retry_start/end; cache_warming_*; manual/auto_compaction_*. Unknown frame types should be ignored, not fatal.

    LOCAL VERIFICATION (omp 19.1.0, 2026-11-21): ready frame and prompt_result {status:'completed', sessionSettled:true} confirmed; agent_end keys [messages,isTerminal,yielded]; get_session_stats.data.cost is a USD number (0.0031 for a haiku 'ok'). --max-cost 0.0001: the first prompt completed (overshoot), the second returned prompt_result {status:'error', error:{code:'cost_cap', retryable:false}} plus notice source 'cost-gate'; the process stayed alive. --max-time 5s with a `sleep 30` task: the run ended after ~6s with prompt_result status 'completed' and no distinguishing signal. CONCLUSION: the daemon must enforce wall-clock timeouts itself (its own timer, then `abort`) and must never treat 'completed' as task success; the verify step decides.
