- text: 'git worktree lifecycle for parallel automated agents: `git worktree add -b <branch> <path> <base>`, removal and `git worktree prune`, recovering abandoned worktrees, and concurrency hazards (index.lock
    / shared refs) when several worktrees of one repo commit simultaneously and a separate worktree runs `git pull` on main.'
  mode: answer
  answer: |-
    SOURCE NOTE: No shell tool was available, so nothing below was run locally. Claims come from the git-worktree manual and the cited article; anything not in those sources is marked [UNVERIFIED].

    1. CREATE
      git worktree add --lock --reason "agent <id>" -b <branch> <path> <base>
    - `-b` refuses if <branch> already exists; `-B` resets it. Use `-b` so collisions fail loudly.
    - `--lock` keeps the worktree locked after creation, "without a race condition" versus a separate `git worktree lock`.
    - `add` refuses if <branch> is already checked out in another worktree (`-f` overrides). So two agents cannot share `main`; have them branch from it.
    - Linked worktrees share refs, objects, packed-refs and config; only HEAD, index and per-worktree files are private (docs, DETAILS/REFS).

    2. LOCK / PROTECT
      git worktree lock --reason "..." <path>
    - Lock writes a `locked` file with the reason into `$GIT_DIR/worktrees/<id>/`. Prune skips locked entries; move, remove and unlock are blocked.
    - Remove of a locked worktree needs `git worktree remove -f -f <path>` (two `-f`). Add/move of a locked path also needs double `--force`.

    3. REMOVE
      git worktree remove [-f] <path>
    - Refuses if the tree has untracked files or modified tracked files. `-f` removes it anyway, and untracked files are deleted with no recovery.
    - Refuses for the main worktree.
    - Removing a worktree does not delete its branch, since branch refs are shared. [UNVERIFIED for your git version; check with `git branch --list`.]
    - Safe pattern: have the agent commit and push first, then `git worktree remove` (no `-f`). A failure means dirty state, so stop and inspect.

    4. PRUNE / ABANDONED WORKTREES
    - If a worktree dir is deleted by hand, its admin entry in `$GIT_DIR/worktrees/<id>` is stale. `git worktree list` marks it `prunable`. `git worktree prune [-n] [-v] [--expire <time>]` removes it; `-n` is dry-run.
    - Git also prunes automatically per `gc.worktreePruneExpire` (default [UNVERIFIED]: 3 months).
    - If a dir was moved instead of deleted: run `git worktree repair <new-path>` from the main worktree, or `git worktree repair` inside the moved tree.
    - Recovering uncommitted work in a deleted dir is not possible from git. Commits survive in the object DB and branch refs; find dangling commits with `git fsck --lost-found` or `git reflog`.
    - Orchestrator sweep: `git worktree prune` and `git worktree list --porcelain -z` (parse `prunable`, `locked`) to find orphans.

    5. CONCURRENCY HAZARDS
    Per-worktree locks: `$GIT_DIR/worktrees/<id>/index.lock` (index). Shared locks, in `$GIT_COMMON_DIR`: `refs/heads/<b>.lock`, `refs/remotes/origin/*.lock`, `packed-refs.lock`, `config.lock`. Git's lock protocol is O_CREAT|O_EXCL on `<file>.lock`, then rename on commit (lockfile.h, per article).
    - Parallel commits on separate branches in separate worktrees: separate index locks and separate branch-ref locks. They are safe to run together.
    - Collision points:
      a) `git fetch`/`git pull` in worktree W updates `refs/remotes/origin/*` and `refs/heads/main`. A concurrent agent's commit only collides if it touches the same ref, or if both write `packed-refs`/`config` simultaneously.
      b) Concurrent `git push -u` or `git branch --set-upstream-to` write the shared `config.lock`.
      c) `git gc`/`pack-refs` need `packed-refs.lock`, which can collide with ref deletes.
    - Retry knobs (article, [UNVERIFIED] vs. docs): `core.filesRefLockTimeout` default 100 ms; `core.packedRefsTimeout` default 1000 ms. Raise them for agent fleets.
    - Diagnostics: `core.lockfilePid=true` (git 2.54+) writes `index~pid.lock`-style PID files so you can tell a dead holder from a live one.
    - Stale lock recovery: confirm no git/hook process is running (`pgrep -fl git`), then `rm "$(git rev-parse --git-path index.lock)"` (or the exact shared lock path). Never delete locks while the holder is alive.
    - A SIGKILL'd `git commit -a` (hook running) leaves `index.lock` behind; SIGTERM/SIGINT are cleaned up by git (article, citing lockfile/tempfile/sigchain source). Also kill orphaned hook children.
    - Multi-checkout is documented as "still experimental" and submodule support incomplete; do not check out superprojects in multiple worktrees.
    - reftable backend serializes all writers on `tables.list.lock`, so one stale lock blocks all worktrees. Stay on the files backend unless you accept that.

    Design implication: one worktree per agent, `--lock` on creation, orchestrator-run `prune` sweep, serialize fetch/pull on main through one process (the daemon), and pass `--lock`-style leases plus PID checks before removing any lock.

    [INFERENCE] Doing `git fetch` once in the daemon, then letting worktrees only commit and push, removes most shared-ref contention.
