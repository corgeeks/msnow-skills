- text: 'Single-instance local daemon on Linux in Node: recommended pattern for a lockfile/pidfile or port-bind lock, graceful shutdown (SIGTERM) that lets child processes (spawned agent sessions) finish
    or be aborted, and optional systemd --user unit.'
  mode: answer
  answer: |-
    RECOMMENDATION (Linux, Node 24, single user daemon)

    1. Single-instance: bind a fixed 127.0.0.1 TCP port (or a Unix socket) as the lock. Do NOT use a pidfile as the primary lock. The kernel releases the socket when the process dies, even on SIGKILL or crash, so there is no stale-lock detection to write. A pidfile needs liveness checks and PID-reuse guards. Skipped: pidfile + flock/proper-lockfile. Add a pidfile only if you need a discoverable PID for ops tooling, and then validate it against /proc/<pid>/cmdline.

    ```ts
    import net from 'node:net';
    export function acquireInstanceLock(port: number): Promise<net.Server> {
      const srv = net.createServer();
      return new Promise((resolve, reject) => {
        srv.once('error', (e: NodeJS.ErrnoException) =>
          reject(e.code === 'EADDRINUSE' ? new Error(`daemon already running on 127.0.0.1:${port}`) : e));
        srv.listen({ port, host: '127.0.0.1' }, () => resolve(srv));
      });
    }
    ```
    Use the returned server for the lock lifetime. Its 'error' listener is removed after the listen callback resolves, so attach a separate error handler then. Notes: the port must be fixed and configurable. Port 0 would not enforce anything. Node's net listen does not set SO_REUSEPORT by default, so a second bind fails with EADDRINUSE.

    2. Child processes: spawn each agent session with `detached: true` so it becomes a process-group leader (POSIX setsid/pgid). Track the pids, then signal the whole group with a negative pid. Wrap each signal in try/catch because ESRCH means the group is already gone.

    ```ts
    import { spawn, type ChildProcess } from 'node:child_process';
    const live = new Map<number, ChildProcess>();
    export function spawnSession(cmd: string, args: string[], opts: object): ChildProcess {
      const c = spawn(cmd, args, { ...opts, detached: true, stdio: ['ignore', 'pipe', 'pipe'] });
      if (c.pid !== undefined) live.set(c.pid, c);
      c.once('exit', () => { if (c.pid !== undefined) live.delete(c.pid); });
      return c;
    }
    const signalGroups = (sig: NodeJS.Signals) => {
      for (const pid of live.keys()) { try { process.kill(-pid, sig); } catch { /* group gone */ } }
    };
    const sleep = (ms: number) => new Promise(r => setTimeout(r, ms));
    let stopping = false;
    async function shutdown(graceMs = 10_000) {
      if (stopping) return;
      stopping = true;
      srv.close();                        // stop accepting new work (srv = lock server)
      signalGroups('SIGTERM');
      const deadline = Date.now() + graceMs;
      while (live.size && Date.now() < deadline) await sleep(100);
      signalGroups('SIGKILL');            // group still exists while any member lives
      process.exit(0);
    }
    process.once('SIGTERM', () => void shutdown());
    process.once('SIGINT', () => void shutdown());
    ```

    Key behavior:
    - Node's signal listeners replace the default exit, so you must call `process.exit` yourself. The code above does.
    - `exit` on the leader does not mean grandchildren are dead. Group signalling covers grandchildren, which is why the SIGKILL pass uses `-pid` too.
    - `detached: true` on POSIX means the child survives the parent unless you signal it. That is why the daemon must do the cleanup, and why the systemd cgroup below is the crash backstop.
    - A hard parent crash (SIGKILL/OOM) skips your handlers. Detached children then keep running. Under systemd, KillMode=control-group kills them, because systemd tracks membership by cgroup, not by process group.

    3. Optional systemd --user unit (`~/.config/systemd/user/software-factory.service`):

    ```ini
    [Unit]
    Description=software-factory daemon
    After=network-online.target

    [Service]
    Type=simple
    WorkingDirectory=%h/Projects/corgeek.net/msnow-skills
    ExecStart=/usr/bin/env node dist/main.js
    Restart=on-failure
    RestartSec=2
    KillMode=control-group
    KillSignal=SIGTERM
    SendSIGKILL=yes
    TimeoutStopSec=15s

    [Install]
    WantedBy=default.target
    ```

    Install and run:
    ```sh
    systemctl --user daemon-reload
    systemctl --user enable --now software-factory.service
    loginctl enable-linger "$USER"   # start at boot without a login session
    ```

    Set TimeoutStopSec above your app's grace period (10s above) so the app can clean up before systemd sends SIGKILL.

    Skipped: pidfile, process supervisor libraries, PR_SET_PDEATHSIG (not exposed by Node). Add a pidfile when ops tooling needs one. Add a child-reaper if sessions outlive the grace period.
