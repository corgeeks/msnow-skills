- text: 'Prior art for DAG-of-agent-tasks schedulers: how Archon (coleam00/Archon) models node state transitions, retries/max_iterations, `until_bash` completion checks, and durable human `wait` gates in
    its SQLite store — schema/table names worth mirroring.'
  mode: deep-research
  answer: |-
    Archon's durable state is in SQLite (bun:sqlite) with WAL, FK on. Schema DDL is in packages/core/src/db/adapters/sqlite.ts createSchema(); additive migrations are in sqlite-migrations.ts. The migrations/000_combined.sql file is Postgres (UUID, JSONB, plpgsql), so do not treat it as the SQLite schema.

    TABLES (SQLite, names verbatim):
    - remote_agent_workflow_runs: id TEXT PK, origin, conversation_id (FK, cascade), codebase_id, workflow_name, user_message, status TEXT DEFAULT 'pending', outcome TEXT CHECK(succeeded|failed), current_step_index, metadata TEXT JSON (holds approval/wait/execution-claim/cancel reason), parent_conversation_id, user_id, parent_run_id (self FK), adopted_from_run_id, started_at, active_phase_started_at, completed_at, last_activity_at, working_path, item_id, output_root, checkout_baseline, completed_outcome.
    - remote_agent_workflow_events: id, workflow_run_id (FK cascade), event_order INTEGER, event_type TEXT NOT NULL, step_index, step_name, data TEXT JSON, created_at. This is the append-only log; pauses/retries/terminals are events.
    - remote_agent_workflow_run_node_sessions: PK(workflow_run_id,node_id), provider, provider_session_id.
    - remote_agent_items: per-project work item (UNIQUE(project_key,key)); status is derived from its runs, not stored.
    - remote_agent_item_asks: id, item_id, run_id, workflow_name, position, ask TEXT, closed_as, answer, closed_at, closed_via, replaced_by_run_id. Partial index on open asks (WHERE closed_as IS NULL).
    - remote_agent_item_waits: id, item_id, run_id, workflow_name, position, event TEXT, about TEXT, created_at, deadline_at TEXT NOT NULL, closed_as, closed_at, met_by_receipt_id, met_by_binding_id, replaced_by_run_id. Partial index on open waits. Per the schema comment, nothing fires at deadline_at; an open wait past it is only reported as overdue.
    - Resource tables: remote_agent_resource_slots(resource_key, capacity), remote_agent_resource_slot_holders(PK resource_key,holder_kind CHECK run|attempt,holder_id), remote_agent_resource_start_requests(status CHECK queued|admitted|skipped|withdrawn).

    RUN STATUS (packages/workflows/src/schemas/run-status.ts): pending | running | completed | failed | cancelled | paused. outcome: succeeded | failed. Terminal = completed, failed, cancelled. Resumable = failed, paused. Terminal events: workflow_completed, workflow_failed, workflow_cancelled.
    CAS claim: `UPDATE remote_agent_workflow_runs SET status='running', ... WHERE id=$1 AND status='pending'` and check rowCount===1 (workflow-run-transitions.ts claimPendingWorkflowRun). Pause uses running→paused CAS and throws WorkflowRunPauseConflictError when it loses.

    NODE STATE (node-state.ts): pending | running | completed | failed | skipped. Skip causes: condition, condition_parse_error, timeout, upstream_failed, upstream_skipped. Skip reasons: prior_success, when_condition, when_condition_parse_error, trigger_rule, timeout.

    RETRY (dag/retry.ts, schemas/retry.ts): runNodeRetryLoop(). Defaults: DEFAULT_NODE_MAX_RETRIES=2, DEFAULT_NODE_RETRY_DELAY_MS=3000, on_error='transient'. Schema: retry: {max_attempts 1–5, delay_ms 1000–60000 (backoff doubles per attempt), on_error: transient|schema_unmet|all}. Fatal failures are never retried. Before each retry it re-checks run status (cancel stops the loop), writes event node_retry_scheduled {nodeId, retry_class, retry_attempt, max_retries, delay_ms}, and sums cost across attempts. Deterministic (bash/script) nodes get no retry unless retry: is explicit. The backoff function getRetryDelayMs is in executor-shared [UNVERIFIED: not read].

    LOOP (schemas/loop.ts, dag/loop-completion.ts): loop: {prompt|command, until_bash, until_field, until, max_iterations (required positive int), on_exhausted: fail|complete (default fail), fresh_context (default false), gate_message, interactive (deprecated)}. At least one completion channel is required ("loop node requires a completion channel"). until_bash: exit 0 means complete. until_field: a boolean field in output_format, required. Channels are typed as 'until'|'until_bash'|'until_field'. Completion-check results are described in gate messages. Example from the README: loop: {prompt, until_bash: "bun run test", max_iterations: 10, fresh_context: true}. [UNVERIFIED: the exact until_bash exit-code evaluator in loop.ts runtime was not read; the schema documents exit 0.]

    WAIT/ATTENTION (schemas/wait-node.ts, run-wait.ts): wait variants are exclusive: duration_ms (capped by MAX_DURABLE_WAIT_MS), until (ISO-8601), event + deadline_ms, or attention {form: message|approval|select|multi_select, options, recommendation, labels, other}. The run status becomes paused and metadata.wait holds {kind: time|event|attention|quota, owner: node|loop_group, nodeId, pauseId, answer, answeredVia, answeredBy, answeredAt, revision}. Pause mints pauseId=randomUUID() and writes a gate_pause event in the same transaction as pauseWorkflowRun (pause.ts pauseGateRespectingExternalTransition). Answer outputs: approval {decision: approve|reject, text}; multi_select {decisions[], text}.

    MIRROR for a minimal scheduler:
    1. Status enums: copy the run enum (6) and node enum (5). Store status with CAS UPDATE ... WHERE status=expected, and check rowCount.
    2. Append-only events table (run_id, seq, type, node, data JSON) for retries, pauses and terminals; derive node state from the last event.
    3. One wait table: run_id, node, kind, event, deadline_at, closed_at, closed_as. Deadlines are reported as overdue, not fired.
    4. Retry: max_attempts + delay_ms with doubling, retry only the transient class, re-check cancel before each attempt.
    5. Loop: require max_iterations and a completion channel (until_bash exit 0). Skip the deprecated until, interactive, and item/resource-slot tables.

    SKIP: items/rulings/merges/landings/tracker_destinations, resource slots, start receipts, Postgres triggers, and state revisions. None are needed for a DAG scheduler.
