- name: Scaffold package, config, and shared types
  description: Create factory/ (package.json, tsconfig, .gitignore), .factory/ (config.json,
    .gitignore), src/shared/types.ts (the domain contract) and src/shared/config.ts
    (load + validate with defaults), with tests.
  status: completed
  spec: specs/scaffold-config-types.md
- name: SQLite database and store
  description: src/daemon/db.ts (open live DB, WAL, migrations, tx, snapshot via VACUUM
    INTO), src/daemon/bus.ts, src/daemon/store.ts (typed repository, CAS transitions,
    cycle-checked deps, ready query, one event per mutation), with tests.
  status: completed
  spec: specs/sqlite-db-and-store.md
- name: Daemon surfaces
  description: HTTP API and daemon process lifecycle, built in parallel against the
    store.
  subtasks:
    - name: HTTP API, SSE, and static UI serving
      description: 'src/daemon/http.ts: createApiServer() with the JSON API, /events
        SSE with Last-Event-ID replay, and static ui/dist serving with SPA fallback;
        tests over an ephemeral port.'
      status: completed
      spec: specs/http-api-sse.md
    - name: Daemon lifecycle and entrypoint
      description: src/daemon/paths.ts, lifecycle.ts (port-bind instance lock, shutdown
        hooks, signal handlers), main.ts (seed live DB, wire store/bus/http, listen);
        tests for single-instance and shutdown hooks.
      status: completed
      spec: specs/daemon-lifecycle.md
